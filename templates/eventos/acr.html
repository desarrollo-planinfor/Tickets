<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Análisis de Causa Raíz - Planinfor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #0f172a;
            --bg-card: #1e293b;
            --border: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #5b9e3b;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Outfit', sans-serif; background: #111827; color: var(--text-main); min-height: 100vh; }
        .container { max-width: 1400px; margin: 0 auto; padding: 30px 20px; }
        .content-container { max-width: 1000px; margin: 0 auto; padding: 30px; background: #1f2937; border-radius: 12px; }

        .page-title { font-size: 1.5rem; font-weight: 600; margin-bottom: 24px; border-bottom: 1px solid #374151; padding-bottom: 10px; }
        
        .info-box { background: #111827; padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #374151; }
        .info-box h4 { color: #9ca3af; font-size: 0.9rem; margin-bottom: 5px; }
        .info-box p { font-size: 1rem; color: #fff; }

    </style>
</head>
<body>
    {% set vista = 'acciones' %}
    {% include 'header_unificado.html' %}

    <div class="container">
        {% include 'eventos/sub_nav.html' %}
        <div class="content-container">
            <h1 class="page-title">Análisis de Causa Raíz (ACR)</h1>
        
        <div class="info-box">
            <h4>Acción Correctiva</h4>
            <p>{{ accion.codigo }} - {{ accion.descripcion }}</p>
        </div>
        
        <p style="color: var(--text-muted);">El análisis iterativo (5 Porqués o Ishikawa) se implementará aquí.</p>
        </div>
    </div>
</body>
</html>
