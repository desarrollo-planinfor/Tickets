<style>
    .sub-nav {
        display: flex;
        gap: 0;
        margin-bottom: 25px;
        border-bottom: 1px solid #374151;
        position: relative;
    }
    .sub-nav-link {
        color: #9ca3af;
        text-decoration: none;
        font-weight: 600;
        font-size: 0.95rem;
        padding: 12px 18px;
        transition: color 160ms ease;
        border-bottom: 3px solid transparent;
        position: relative;
    }
    .sub-nav-link:hover { color: #f3f4f6; }
    .sub-nav-link.active { color: #f3f4f6; }
</style>
<div class="sub-nav tabs-bar--ink" id="eventos-sub-nav">
    <span class="tabs-ink" aria-hidden="true"></span>

    <a href="{{ url_for('eventos_legacy.acciones_lista') }}" class="sub-nav-link {% if vista == 'acciones' %}active{% endif %}" data-lv-ignore>Acciones Correctivas</a>
    <a href="{{ url_for('eventos_legacy.dashboard_eventos') }}" class="sub-nav-link {% if vista == 'dashboard_eventos' %}active{% endif %}" data-lv-ignore>Métricas</a>
    {% if g.usuario.rol == 'admin' %}
    <a href="{{ url_for('eventos_legacy.configuraciones_eventos') }}" class="sub-nav-link {% if vista == 'configuraciones_eventos' %}active{% endif %}" data-lv-ignore>Configuraciones</a>
    {% endif %}
</div>
