<style>
    .sub-nav {
        display: flex;
        gap: 0;
        margin-bottom: 25px;
        margin-top: 10px;
        border-bottom: 1px solid #374151;
        position: relative;
    }
    .sub-nav-link {
        color: #9ca3af;
        text-decoration: none;
        font-weight: 600;
        font-size: 0.95rem;
        padding: 12px 18px;
        transition: color 160ms ease;
        border-bottom: 3px solid transparent;
        position: relative;
    }
    .sub-nav-link:hover { color: #f3f4f6; }
    .sub-nav-link.active { color: #f3f4f6; }
</style>
<div class="sub-nav tabs-bar--ink" id="hallazgos-sub-nav">
    <span class="tabs-ink" aria-hidden="true"></span>
    <a href="{{ url_for('hallazgos.dashboard') }}" class="sub-nav-link {% if sub_vista == 'dashboard' %}active{% endif %}" data-lv-ignore>Dashboard</a>
    <a href="{{ url_for('hallazgos.lista') }}" class="sub-nav-link {% if sub_vista == 'lista' %}active{% endif %}" data-lv-ignore>Eventos</a>
    <a href="{{ url_for('hallazgos.acciones_correctivas') }}" class="sub-nav-link {% if sub_vista == 'acciones' %}active{% endif %}" data-lv-ignore>Acciones Correctivas</a>
    {% if g.usuario.rol == 'admin' %}
    <a href="{{ url_for('hallazgos.configuraciones') }}" class="sub-nav-link {% if sub_vista == 'configuraciones' %}active{% endif %}" data-lv-ignore>Configuraciones</a>
    {% endif %}
</div>
